<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="uniflow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6bf0" />
      <stop offset="100%" stop-color="#5142c1" />
    </linearGradient>
    <linearGradient id="inner-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#uniflow-grad)" />
  <rect width="512" height="512" rx="120" fill="url(#inner-shine)" />
  
  <!-- Modern Geometric U-Flow Symbol -->
  <g fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Stem to Bottom Curve to Right Stem -->
    <path d="M 160 160 V 272 C 160 336 216 368 256 368 C 296 368 352 336 352 272 V 160" />
    <!-- Dynamic academic accent node -->
    <circle cx="256" cy="236" r="16" fill="#ffffff" stroke="none" />
  </g>
