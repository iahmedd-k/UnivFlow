[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studypilot"
version = "1.0.0"
description = "StudyPilot - Personal Agentic Academic Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.32",
    "alembic==1.13.1",
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.3.3",
    "httpx==0.27.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "Pillow==12.3.0",
    "pytesseract==0.3.13",
    "pypdf==5.9.0",
    "apscheduler==3.10.4",
    "langgraph>=0.2.10,<0.3.0",
    "langchain-core>=0.3.10,<0.4.0",
    "langchain-groq>=0.3.8,<0.4.0",
    "groq>=0.13.0,<1.0.0",
    "crewai[google-genai,litellm]>=1.15.0,<2.0.0",
    "playwright==1.44.0",
    "google-api-python-client==2.126.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.0",
    "google-auth==2.30.0",
    # "psycopg2-binary==2.9.9",  # Requires PostgreSQL installation - install for production
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
]

[project.scripts]
seed = "scripts.seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
